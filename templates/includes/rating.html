<div class="rating" data-target="{{ target|default:'question' }}" data-id="{{ item_id }}">
    [
    {% if user.is_authenticated %}
    <a href="#" class="vote-btn {% if vote == 'up' %}active{% endif %}" data-vote="like">+</a>
    <span class="rating-value">{{ rating }}</span>
    <a href="#" class="vote-btn {% if vote == 'down' %}active{% endif %}" data-vote="dislike">−</a>
    {% else %}
    <span class="vote-disabled" title="Войдите, чтобы проголосовать">+</span>
    <span class="rating-value">{{ rating }}</span>
    <span class="vote-disabled" title="Войдите, чтобы проголосовать">−</span>
    {% endif %}
    ]
</div>
