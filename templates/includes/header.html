{% load static %}
<div class="topbar">
    <a href="{% url 'index' %}">Главная</a>
    <a href="{% url 'rules' %}">Правила</a>
    <a href="{% url 'help' %}">Помощь</a>
</div>

<header>
    <div class="logo">
        <a href="{% url 'index' %}">
            <h1>Qurilka</h1>
        </a>
        <div class="slogan">Не вкурил? Спроси. Вкурил — объясни.</div>
    </div>

    <form class="header-search" action="#">
        <input type="search" class="input" placeholder="Поиск">
        <button type="submit" class="button">Найти</button>
    </form>

    {% if user.is_authenticated %}
    <a href="{% url 'ask' %}" class="button">Задать вопрос</a>
    <div class="header-user-information">
        <img class="header-user-avatar" src="{% static 'core/img/avatar.png' %}" alt="avatar">
        <div class="header-profile-options">
            <a href="{% url 'profile' %}"><b>{{ user.username }}</b></a>
            <div class="user-status">прохожий</div>
            <div>
                <a href="{% url 'profile' %}">настройки</a> |
                <a href="{% url 'login' %}">выход</a>
            </div>
        </div>
    </div>
    {% else %}
    <div class="header-user-information">
        <a href="{% url 'login' %}">Вход</a> |
        <a href="{% url 'signup' %}">Регистрация</a>
    </div>
    {% endif %}
</header>
