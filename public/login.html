{% extends 'base.html' %}
{% load static %}

{% block title %}Вход — Qurilka{% endblock %}

{% block content %}
<h2>Вход</h2>

<div class="error">Неверный логин или пароль!</div>

<form>
    <div class="form-row">
        <label for="login">Логин</label>
        <div class="field">
            <input type="text" class="input" id="login" placeholder="Введите ваш логин">
        </div>
    </div>
    <div class="form-row">
        <label for="password">Пароль</label>
        <div class="field">
            <input type="password" class="input invalid" id="password" value="12345678">
            <div class="field-error">Проверьте пароль.</div>
        </div>
    </div>
    <div class="form-row">
        <label></label>
        <div class="field"><a href="/" class="button">Войти</a></div>
    </div>
    <div class="form-row">
        <label></label>
        <div class="field"><a href="/signup/">Создать аккаунт</a></div>
    </div>
</form>
{% endblock %}
