{% extends 'base.html' %}
{% load static %}

{% block title %}Новый вопрос — Qurilka{% endblock %}

{% block content %}
<h2>Новый вопрос</h2>

<form>
    <div class="form-row">
        <label for="title">Заголовок</label>
        <div class="field">
            <input type="text" class="input" id="title" value="Как это сделать?">
            <div class="hint">Коротко и по делу, до 100 символов.</div>
        </div>
    </div>
    <div class="form-row">
        <label for="text">Текст</label>
        <div class="field">
            <textarea class="input" id="text" rows="15">Lorem ipsum dolor sit amet, consectetuer adipiscing elit, sed diam nonummy nibh euismod tincidunt ut laoreet dolore magna aliquam erat volutpat.</textarea>
            <div class="hint">Опишите проблему подробно.</div>
        </div>
    </div>
    <div class="form-row">
        <label for="tags">Теги</label>
        <div class="field">
            <input type="text" class="input invalid" id="tags" value="сигареты, перекур, табак, зажигалки, дым, пепел">
            <div class="field-error">Не больше 5 тегов.</div>
            <div class="hint">Теги через запятую.</div>
        </div>
    </div>
    <div class="form-row">
        <label></label>
        <div class="field"><button type="submit" class="button">Спросить</button></div>
    </div>
</form>
{% endblock %}
